<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日やること</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>今日やること</h1>

        <div class="date-area">
            <button onclick="changeDate(-1)">‹</button>

            <div>
                <div id="today"></div>
                <button class="today-button" onclick="goToday()">今日</button>
            </div>

            <button onclick="changeDate(1)">›</button>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="やることを入力"
            >

            <button onclick="addTask()">追加</button>
        </div>

        <p class="help">
            ※ やることを長押しすると操作できます
        </p>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
